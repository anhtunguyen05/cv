name: Create task issues

on:
  pull_request_target:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      group:
        description: Story task group to provision
        required: true
        type: choice
        options:
          - story-1-1
          - story-1-2
          - story-1-3
          - story-1-4
          - story-1-5
          - story-1-6
          - story-1-7
          - story-1-8

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: create-task-issues-${{ github.event.pull_request.number || inputs.group }}
  cancel-in-progress: false

jobs:
  create-issues:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted base configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Create configured task issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          ISSUE_TASK_GROUP: ${{ inputs.group }}
        run: python3 .github/scripts/create_pr_task_issues.py
