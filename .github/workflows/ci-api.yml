name: CI - API

on:
  push:
    paths:
      - 'apps/api/**'
      - 'docs/contracts/jd/**'
      - 'docs/contracts/operational-safety/**'
      - '_bmad-output/implementation-artifacts/spec-5-*.md'
      - '_bmad-output/planning-artifacts/epics/epic-5-operational-safety/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docs/contracts/jd/**'
      - 'docs/contracts/operational-safety/**'
      - '_bmad-output/implementation-artifacts/spec-5-*.md'
      - '_bmad-output/planning-artifacts/epics/epic-5-operational-safety/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SESSION_DRIVER: database
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel -d laravel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, pdo_pgsql, redis
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan migrate --force --no-interaction

      - name: Verify PostgreSQL refresh-safe migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run deterministic matching quality gate
        id: match-quality
        run: |
          mkdir -p storage/framework/testing
          set +e
          php artisan match:quality --json > storage/framework/testing/match-quality-result.json
          status=$?
          set -e
          test -s storage/framework/testing/match-quality-result.json
          exit "$status"

      - name: Upload deterministic matching quality artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: match-quality-${{ github.sha }}
          path: apps/api/storage/framework/testing/match-quality-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Run operational safety baseline gate
        run: |
          set +e
          php artisan safety:baseline > storage/framework/testing/safety-baseline-result.json
          status=$?
          set -e
          test "$status" -eq 20
          test -s storage/framework/testing/safety-baseline-result.json

      - name: Run orchestration plan gate
        run: php artisan safety:orchestration-plan

      - name: Upload operational safety baseline artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-safety-${{ github.sha }}
          path: apps/api/storage/framework/testing/safety-baseline-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: composer test
