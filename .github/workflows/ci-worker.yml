name: CI - Worker

on:
  push:
    paths:
      - 'apps/worker/**'
      - 'docs/contracts/ai/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'docs/contracts/ai/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Worker checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-input 'uv==0.12.17'

      - name: Install worker dependencies from lock
        run: uv sync --frozen --extra test

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q app tests

      - name: Run tests
        run: uv run --frozen pytest -q
