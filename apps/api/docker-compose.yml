services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - .:/var/www
      - ../../docs:/workspace/docs:ro

    networks:
      - laravel_network

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine

    container_name: laravel_nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - laravel_network

    depends_on:
      - app

  db:
    image: postgres:16-alpine

    container_name: laravel_postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - laravel_network

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "laravel",
          "-d",
          "laravel"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    container_name: laravel_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - laravel_network

volumes:
  postgres_data:
  redis_data:

networks:
  laravel_network:
    driver: bridge
